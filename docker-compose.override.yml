# Auto-loaded by `docker compose up` alongside docker-compose.yml.
# Switches frontend/backend/python-ai to hot-reloading dev builds by
# bind-mounting source and running dev servers instead of the production
# images. Not used in CI/prod (those invoke docker-compose.yml explicitly
# with `-f`, which skips this file).
services:
  frontend:
    build:
      target: deps
    command: npm run dev
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/src

  python-ai:
    build:
      context: ./python-ai
      dockerfile: Dockerfile.dev
    volumes:
      - ./python-ai/app:/app/app
      - ./python-ai/tests:/app/tests
