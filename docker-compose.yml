services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm", "local-embedding"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen3:1.7b"]
    depends_on:
      ollama:
        condition: service_healthy

  ollama-embedding-init:
    image: ollama/ollama:latest
    profiles: ["local-llm", "local-embedding"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "bge-m3"]
    depends_on:
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      AI_SERVICE_URL: http://python-ai:8000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      python-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  python-ai:
    build: ./python-ai
    environment:
      KNOWLEDGE_INDEX_PATH: /data/knowledge-index.json
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      SEMANTIC_CHUNKING_MODE: ${SEMANTIC_CHUNKING_MODE:-embedding}
      CHUNKING_LLM_PROVIDER: ${CHUNKING_LLM_PROVIDER:-openai}
      CHUNKING_LLM_MODEL: ${CHUNKING_LLM_MODEL:-}
      CHUNKING_LLM_BATCH_UNITS: ${CHUNKING_LLM_BATCH_UNITS:-25}
      CHUNKING_LLM_OVERLAP_UNITS: ${CHUNKING_LLM_OVERLAP_UNITS:-3}
      CHUNKING_LLM_CONCURRENCY: ${CHUNKING_LLM_CONCURRENCY:-1}
      OPENAI_MAX_RETRY_ATTEMPTS: ${OPENAI_MAX_RETRY_ATTEMPTS:-6}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: qwen3:1.7b
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    volumes:
      - knowledge-data:/data
    ports:
      - "8000:8000"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
        required: false
      ollama-embedding-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  knowledge-data:
  ollama-data:
